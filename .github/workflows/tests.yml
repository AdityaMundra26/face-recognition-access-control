name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # buffalo_l is a ~280MB download on first use; cache it across runs so
      # CI doesn't re-fetch it every time.
      - name: Cache InsightFace model pack
        uses: actions/cache@v4
        with:
          path: ~/.insightface
          key: insightface-buffalo_l

      - name: Install system libraries required by opencv-python
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
